<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライド画像 - セミナー資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f8ec;
    --ink: #2a3327;
    --ink-soft: #56624f;
    --border: #d8e4c8;
    --accent-deep: #466239;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-size: 20px;
    line-height: 1.9;
    -webkit-text-size-adjust: 100%;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 32px;
  }

  header a {
    display: inline-block;
    color: var(--accent-deep);
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
  }

  table {
    margin: auto;
    border-collapse: collapse;
  }

  td {
    padding: 15px;
    text-align: center;
  }

  .thumbnail {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 220px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .thumbnail:hover {
    transform: scale(1.03);
  }

  .thumbnail img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    display: block;
  }

  .caption {
    padding: 10px;
    font-size: 14px;
    background: white;
    color: var(--ink);
  }

  /* モーダル */
  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
  }

  .modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  .modal.active {
    display: flex;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 64px;
    height: 64px;
    border: none;
    border-radius: 50%;
    font-size: 36px;
    cursor: pointer;
    background: rgba(255,255,255,0.85);
    color: #333;
    transition: 0.2s;
  }

  .nav-btn:hover {
    background: white;
    transform: translateY(-50%) scale(1.08);
  }

  .prev { left: 30px; }
  .next { right: 30px; }

  footer {
    text-align: center;
    margin-top: 64px;
    padding-top: 32px;
    border-top: 2px solid var(--border);
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* スマートフォン対応（テーブルの崩れ防止） */
  @media (max-width: 600px) {
    .container { padding: 24px 16px 60px; }
    td { display: block; padding: 10px auto; }
    .thumbnail { width: 100%; max-width: 280px; margin: 0 auto; }
    .thumbnail img { width: 100%; height: auto; aspect-ratio: 1/1; }
    .nav-btn { width: 48px; height: 48px; font-size: 24px; }
    .prev { left: 10px; }
    .next { right: 10px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <a href="index.html">◀ ご案内ページに戻る</a>
  </header>

  <table>
    <tr>
      <td>
        <div class="thumbnail">
          <img src="./images/chirashi.png" alt="">
          <div class="caption">Top1</div>
        </div>
      </td>
     <td>
        <div class="thumbnail">
          <img src="./images/web.png" alt="">
          <div class="caption">WEBサイトの閲覧</div>
        </div>
      </td>
      <td>
        <div class="thumbnail">
          <img src="./images/server2.png" alt="">
          <div class="caption">サーバー 1</div>
        </div>
      </td>
    </tr>
    <tr>
     <td>
        <div class="thumbnail">
          <img src="./images/server1.png" alt="">
          <div class="caption">サーバー 2</div>
        </div>
      </td>

      <td>
        <div class="thumbnail">
          <img src="./images/yougo.png" alt="">
          <div class="caption">用語1</div>
        </div>
      </td>
      <td>
        <div class="thumbnail">
          <img src="./images/rag.png" alt="">
          <div class="caption">RAG1</div>
        </div>
      </td>
     </tr>
    <tr>     


      <td>
        <div class="thumbnail">
          <img src="./images/rag2.png" alt="">
          <div class="caption">RAG2</div>
        </div>
      </td>
      <td>
        <div class="thumbnail">
          <img src="./images/extension.png" alt="">
          <div class="caption">拡張子</div>
        </div>
      </td>


      <td>
        <div class="thumbnail">
          <img src="./images/oss.png" alt="">
          <div class="caption">RAG2</div>
        </div>
      </td>
    </tr>
    <tr>      
      <td>
        <div class="thumbnail">
          <img src="./images/ocr.png" alt="">
          <div class="caption">OCR</div>
        </div>
      </td>
      <td>
        <div class="thumbnail">
          <img src="./images/digital1.png" alt="">
          <div class="caption">デジタル主権</div>
        </div>
      </td>
    </tr>
    <tr>
      <td>
        <div class="thumbnail">
          <img src="./images/digital2.png" alt="">
          <div class="caption">デジタル立憲主義</div>
        </div>
      </td>
    </tr>
  </table>

  <div class="modal" id="modal">
    <button id="prevBtn" class="nav-btn prev">❮</button>
    <img id="modalImage" src="" alt="">
    <button id="nextBtn" class="nav-btn next">❯</button>
  </div>

  <footer>
    最終更新日：2026年5月30日<br>
  </footer>

</div>

<script>
  const images = document.querySelectorAll('.thumbnail img');
  const modal = document.getElementById('modal');
  const modalImage = document.getElementById('modalImage');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = 0;

  // 画像一覧のsrcを取得
  const imageList = Array.from(images).map(img => img.src);

  // 指定したインデックスの画像を表示する関数
  function showImage(index) {
    modalImage.src = imageList[index];
  }

  // 各サムネイルにクリックイベントを追加
  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage(currentIndex);
      modal.classList.add('active');
    });
  });

  // モーダルの背景をクリックしたら閉じる
  modal.addEventListener('click', (e) => {
    // 画像やボタンをクリックした時は閉じないようにする
    if (e.target === modal) {
      modal.classList.remove('active');
    }
  });

  // 次へボタン
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // モーダルを閉じるイベントを止める
    currentIndex++;
    if (currentIndex >= imageList.length) {
      currentIndex = 0;
    }
    showImage(currentIndex);
  });

  // 前へボタン
  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // モーダルを閉じるイベントを止める
    currentIndex--;
    if (currentIndex < 0) {
      currentIndex = imageList.length - 1;
    }
    showImage(currentIndex);
  });
</script>

</body>
</html>
